spring.application.name=gerenciador-senhas-api

# Render injeta a variavel PORT. Em execucao local usa 8080.
server.port=${PORT:8080}

# Suporta tanto variaveis individuais (Render/DB_*) quanto uma URL JDBC completa.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gerenciador_senhas}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:22426230}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration-ms=86400000

# AES-256
api.security.aes.secret=${AES_SECRET}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method