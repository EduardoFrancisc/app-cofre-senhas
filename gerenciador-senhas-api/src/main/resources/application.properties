spring.application.name=gerenciador-senhas-api

spring.datasource.url=jdbc:postgresql://localhost:5432/gerenciador_senhas
spring.datasource.username=postgres
spring.datasource.password=22426230

spring.jpa.hibernate.ddl-auto=update

# =============================================
# Configuração JWT
# =============================================
# Chave secreta HMAC-SHA256 — mínimo 256 bits (32 bytes em Base64)
# IMPORTANTE: substitua por uma chave gerada com `openssl rand -base64 64` em produção
api.security.token.secret=${JWT_SECRET}
# Tempo de expiração do token: 86400000 ms = 24 horas
api.security.token.expiration-ms=86400000
# Chave secreta AES-256 — exatamente 32 bytes em Base64
# Gere com: openssl rand -base64 32
api.security.aes.secret=${AES_SECRET}

# =============================================
# SpringDoc / Swagger UI
# =============================================
# Caminho padrão da especificação OpenAPI
springdoc.api-docs.path=/v3/api-docs
# Habilita o Swagger UI /swagger-ui/index.html
springdoc.swagger-ui.enabled=true
# Ordena os endpoints por método HTTP
springdoc.swagger-ui.operations-sorter=method