services:
  postgres:
    image: postgres:16
    container_name: gerenciador_senhas
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=22426230
      - POSTGRES_DB=gerenciador_senhas
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: